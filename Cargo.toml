[package]
name = "Ecoli"
version = "0.1.0"
edition = "2024"
authors = ["at-robins"]
description = "Es Compiler Light"
repository = "https://github.com/at-robins/ecoli"
homepage = "https://github.com/at-robins/ecoli"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
getset = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"